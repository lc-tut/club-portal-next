# SOPSの受信者(復号できる人)の設定(要件定義の第5節)
# 受信者はサーバーの鍵と弊社の管理者の鍵に限る、運用会社の代表は入れない
#
# sopsは作業ディレクトリから.sops.yamlを探すので、secrets/に移動してから実行する
#   cd secrets
#   sops edit --input-type yaml --output-type yaml admins.secrets.yaml.enc
# editは平文を一時ファイルにだけ置き、保存すると暗号化して書き戻す
#
# TODO(P5):ホスティング先が決まったらサーバーの鍵を足し、
# 既存のファイルを sops updatekeys <ファイル> で暗号化し直す
creation_rules:
  - path_regex: \.enc$
    age: >-
      age1tdax5knjmmna0edgkcnmy05vuks5zmv0368k9tprt48x6xhchavq7wqly6
