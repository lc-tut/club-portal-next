# セキュリティスキャン(要件定義の第9節):依存の脆弱性、秘密情報の混入、CodeQL
# コンテナイメージのTrivyはci.ymlのimageジョブで行う
# PRごとに加え、新しく見つかった脆弱性に気づけるよう週に1回も実行する
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * 1" # 毎週月曜9時(日本時間)

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: 依存の脆弱性(pip-audit、pnpm audit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.9
      - name: pip-audit
        working-directory: backend
        run: |
          uv export --frozen --all-groups --no-emit-project --format requirements-txt > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit@2.10.1 --strict --disable-pip --requirement "$RUNNER_TEMP/requirements.txt"
      # 無視する脆弱性はfrontend/pnpm-workspace.yamlのauditConfigに理由つきで書く
      - name: pnpm audit(本番の依存はmoderate以上で失敗)
        working-directory: frontend
        run: pnpm audit --prod --audit-level moderate
      - name: pnpm audit(開発の依存も含めてhigh以上で失敗)
        working-directory: frontend
        run: pnpm audit --audit-level high

  gitleaks:
    name: 秘密情報の混入(gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # 履歴全体を調べる
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.9
          install: false
      - run: mise exec gitleaks@8.30.1 -- gitleaks git --redact --no-banner --verbose

  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
