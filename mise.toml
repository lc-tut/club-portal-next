# 開発ツールのバージョン固定とよく使う操作
# 使い方はCLAUDE.mdの「コマンド」を参照

[tools]
python = "3.15.2"
uv = "0.13.9"
node = "26.13.1"
pnpm = "12.21.0"
dbmate = "2.38.1"
sops = "3.13.3"
age = "1.3.2"

[env]
# 開発専用の接続先
# compose.dev.yamlのDB(127.0.0.1にだけ公開)を指す
# 本番の接続情報はDocker secretsで渡し、この値は使わない
# dbmate(マイグレーション用のユーザー)
DATABASE_URL = "postgres://clubportal:clubportal-dev-only@127.0.0.1:5432/clubportal?sslmode=disable"
# アプリ(権限を絞ったユーザー)
CLUBPORTAL_DATABASE_URL = "postgresql+psycopg://clubportal_app:clubportal-app-dev-only@127.0.0.1:5432/clubportal"
CLUBPORTAL_IMAGE_DIR = "{{config_root}}/.data/images"
# テスト用DB(pytestが中身を消してシードを入れ直す)
CLUBPORTAL_TEST_DATABASE_URL = "postgresql+psycopg://clubportal_app:clubportal-app-dev-only@127.0.0.1:5432/clubportal_test"
CLUBPORTAL_TEST_ADMIN_DATABASE_URL = "postgres://clubportal:clubportal-dev-only@127.0.0.1:5432/clubportal_test?sslmode=disable"
DBMATE_MIGRATIONS_DIR = "db/migrations"
# スキーマの書き出しには手元のpg_dumpが要るので、しない
DBMATE_NO_DUMP_SCHEMA = "true"
# フロント(Next.jsのサーバー):公開APIの接続先と、og:imageなどの絶対URLの元
CLUBPORTAL_API_INTERNAL_URL = "http://127.0.0.1:8000"
CLUBPORTAL_PUBLIC_ORIGIN = "http://localhost:3000"
# Next.jsの利用状況を外部へ送らない
NEXT_TELEMETRY_DISABLED = "1"

# ---- 起動 ----

[tasks.dev]
description = "DB、バックエンド、フロントを起動する(Ctrl+Cで止める)"
depends = ["dev:backend", "dev:frontend"]

[tasks."dev:backend"]
hide = true
depends = ["setup", "migrate"]
dir = "backend"
run = "uv run uvicorn --factory clubportal.main:create_app --reload --host 127.0.0.1 --port 8000"

[tasks."dev:frontend"]
hide = true
depends = ["setup"]
dir = "frontend"
run = "pnpm dev"

[tasks.setup]
description = "依存をロックファイルどおりに入れる"
run = [
  "uv sync --project backend --frozen",
  "pnpm --dir frontend install --frozen-lockfile",
  # LayoutPropsなどNext.jsのルートの型を.next/に生成する(tscとvitestの型検査に要る)
  "pnpm --dir frontend exec next typegen",
]

# ---- DB ----

[tasks."db:up"]
description = "開発用DBを起動し、使えるようになるまで待つ"
run = "docker compose -f compose.dev.yaml up -d --wait"

[tasks."db:down"]
description = "開発用DBを止める(データは残る)"
run = "docker compose -f compose.dev.yaml down"

[tasks."db:reset"]
description = "開発用DBをデータごと消して作り直す(初期化スクリプトも流し直す)"
run = [
  "docker compose -f compose.dev.yaml down --volumes",
  "docker compose -f compose.dev.yaml up -d --wait",
]

[tasks.migrate]
description = "マイグレーションを適用する(開発用DBとテスト用DB)"
depends = ["db:up"]
run = [
  "dbmate --wait up",
  "dbmate --wait --url \"$CLUBPORTAL_TEST_ADMIN_DATABASE_URL\" up",
]

[tasks.seed]
description = "開発用DBにシード(架空のサークル)を入れ直し、画像を置く"
depends = ["migrate"]
run = [
  "docker compose -f compose.dev.yaml exec -T db psql -v ON_ERROR_STOP=1 -q -U clubportal -d clubportal < db/seeds/dev.sql",
  "mkdir -p \"$CLUBPORTAL_IMAGE_DIR\"",
  "cp db/seeds/images/*.webp \"$CLUBPORTAL_IMAGE_DIR\"/",
]

# ---- 検査 ----

[tasks.lint]
description = "静的検査(ruff、mypy、import-linter、ESLint、tsc、Prettier)"
depends = ["lint:backend", "lint:frontend"]

[tasks."lint:backend"]
hide = true
depends = ["setup"]
dir = "backend"
run = [
  "uv run ruff check",
  "uv run ruff format --check",
  "uv run mypy",
  "uv run lint-imports",
]

[tasks."lint:frontend"]
hide = true
depends = ["setup"]
dir = "frontend"
run = [
  "pnpm exec eslint .",
  "pnpm exec tsc --noEmit",
  "pnpm exec prettier --check .",
]

[tasks.test]
description = "テスト(pytest、vitest、storyのテスト、ページのテスト)"
depends = ["test:backend", "test:frontend", "test:pages"]

[tasks."test:backend"]
hide = true
# テスト用DBを起動してマイグレーションを適用してから実行する
depends = ["setup", "migrate"]
dir = "backend"
run = "uv run pytest"

[tasks."test:frontend"]
hide = true
depends = ["setup"]
dir = "frontend"
run = "pnpm exec vitest run --project unit --project storybook"

[tasks."test:pages"]
hide = true
# テスト用DBを使うので、backendのテストと同時には流さない
depends = ["setup", "migrate"]
wait_for = ["test:backend"]
run = "scripts/page-tests.sh"

# ---- API ----

[tasks.gen-api]
description = "FastAPIからapi/openapi.yamlを書き出し、フロントの型を生成する"
depends = ["setup"]
run = [
  "uv run --project backend python -m clubportal.export_openapi api/openapi.yaml",
  "pnpm --dir frontend exec openapi-typescript ../api/openapi.yaml -o src/lib/api/schema.d.ts",
]
